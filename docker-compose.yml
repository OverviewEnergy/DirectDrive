# `docker compose up -d` starts influxdb + grafana. The api runs natively via
# systemd so it can reach USB without device passthrough.
# Containerised api instead:  docker compose --profile containerised up -d --build

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-leolaser}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token}
      # Offline: stops outbound reporting stalling startup.
      INFLUXD_REPORTING_DISABLED: "true"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD","influx","ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Offline: without these the UI blocks on network timeouts every load.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-token}
      INFLUX_ORG: ${INFLUX_ORG:-leolaser}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb: {condition: service_healthy}

  api:
    profiles: ["containerised"]
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      INFLUX_URL: http://influxdb:8086
    depends_on:
      influxdb: {condition: service_healthy}

volumes:
  influx-data:
  influx-config:
  grafana-data:
