<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direct-drive stand</title>
<style>
:root{
  --paper:#EDEAE3; --card:#F7F5F1; --ink:#14181B; --slate:#5C6670;
  --rule:#C9C4B8; --safe:#0B6E4F; --caution:#C8A200; --signal:#B3200E;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}

.eyebrow{
  font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--slate);
}

/* status bar */
.bar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:2px solid var(--ink);
}
.bar .ident{font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.bar .spacer{flex:1}
.chip{
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em;
  padding:5px 14px;border:2px solid var(--ink);background:var(--card);
}
.chip[data-state="ENABLED"]{background:var(--safe);border-color:var(--safe);color:#fff}
.chip[data-state="ARMED"]{background:var(--caution);border-color:var(--caution)}
.chip[data-state="FAULT"]{background:var(--signal);border-color:var(--signal);color:#fff}
.link{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--slate);
}
.link[data-up="0"]{color:var(--signal);font-weight:700}

/* control rail */
.rail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 22px}
.rail .gap{flex:1}
button{
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:11px 20px;background:var(--card);
  color:var(--ink);border:2px solid var(--ink);cursor:pointer;
}
button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--caution);outline-offset:2px}
.primary{background:var(--safe);border-color:var(--safe);color:#fff}
.primary:hover:not(:disabled){background:var(--ink);border-color:var(--ink)}
.danger{
  background:var(--signal);border-color:var(--signal);color:#fff;
  padding:11px 30px;font-weight:800;
}
.danger:hover{background:#8C1809;border-color:#8C1809}

/* current band gauge */
.gauge{border:2px solid var(--ink);background:var(--card);padding:14px 16px 10px}
.gauge .head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.gauge .val{
  font-family:var(--mono);font-size:64px;font-weight:700;line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.gauge .unit{font-family:var(--mono);font-size:20px;color:var(--slate)}
.gauge .head .spacer{flex:1}
.gauge .limit{font-family:var(--mono);font-size:11px;color:var(--slate);text-align:right}
.gauge.over .val{color:var(--signal)}
.track{position:relative;height:34px;border:1px solid var(--rule);overflow:hidden}
.band{position:absolute;top:0;bottom:0}
.band.ok{background:rgba(11,110,79,.14)}
.band.warn{background:rgba(200,162,0,.28)}
.band.bad{background:rgba(179,32,14,.26)}
.redline{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--signal)}
.needle{
  position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--ink);
  transition:left .12s linear;
}
.fill{position:absolute;top:0;bottom:0;left:0;background:rgba(20,24,27,.10)}
.ticks{
  display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;color:var(--slate);margin-top:4px;
}

/* channels */
.channels{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;background:var(--rule);border:2px solid var(--ink);margin-top:18px;
}
.ch{background:var(--card);padding:11px 13px 8px}
.ch .num{
  font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-top:2px;
}
.ch .num small{font-size:13px;font-weight:400;color:var(--slate);margin-left:3px}
.ch canvas{display:block;width:100%;height:30px;margin-top:6px}
.ch.stale .num{color:var(--slate)}
.ch.stale .num::after{content:" stale";font-size:10px;letter-spacing:.1em}
.ch.alarm{background:rgba(179,32,14,.10)}
.ch.alarm .num{color:var(--signal)}

/* guard strip */
.guards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--rule);border:2px solid var(--ink);
  border-top:none;margin-bottom:20px;
}
.guard{background:var(--card);padding:9px 13px;display:flex;
  justify-content:space-between;align-items:baseline;gap:8px}
.guard b{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em}
.guard[data-ok="1"] b{color:var(--safe)}
.guard[data-ok="0"] b{color:var(--signal)}

/* log */
.log{border:2px solid var(--ink);background:var(--card);max-height:210px;overflow:auto}
.log div{
  font-family:var(--mono);font-size:12px;padding:5px 13px;
  border-bottom:1px solid var(--rule);display:flex;gap:14px;
}
.log div:last-child{border-bottom:none}
.log time{color:var(--slate);flex-shrink:0}
.log .nm{font-weight:700;min-width:96px}
.log .fault .nm,.log .estop .nm{color:var(--signal)}

.flash{animation:flash .45s steps(2,end) 2}
@keyframes flash{50%{background:var(--signal);color:#fff}}
@media (prefers-reduced-motion:reduce){
  .flash{animation:none}
  .needle{transition:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="ident" id="ident">—</span>
    <span class="spacer"></span>
    <span class="link" id="link" data-up="0">LINK DOWN</span>
    <span class="chip" id="chip" data-state="IDLE">IDLE</span>
  </div>

  <div class="rail">
    <button id="bArm">Arm</button>
    <button id="bEnable" class="primary">Enable</button>
    <button id="bStop">Stop</button>
    <button id="bMark">Mark shade</button>
    <button id="bReset">Reset</button>
    <span class="gap"></span>
    <button id="bEstop" class="danger">E‑stop</button>
  </div>

  <div class="gauge" id="gauge">
    <div class="eyebrow">Load current</div>
    <div class="head">
      <span class="val" id="cVal">—</span><span class="unit">A</span>
      <span class="spacer"></span>
      <span class="limit" id="cLimit"></span>
    </div>
    <div class="track" id="track">
      <div class="band ok"   id="bandOk"></div>
      <div class="band warn" id="bandWarn"></div>
      <div class="band bad"  id="bandBad"></div>
      <div class="fill"      id="fill"></div>
      <div class="redline"   id="redline"></div>
      <div class="needle"    id="needle" style="left:0"></div>
    </div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div class="channels" id="channels"></div>
  <div class="guards" id="guards"></div>

  <div class="eyebrow" style="margin-bottom:6px">Event log</div>
  <div class="log" id="log"></div>
</div>

<script>
const FULL_SCALE = 14.0;
const CH = [
  {k:"voltage_v",      label:"Voltage",       unit:"V",   dp:2},
  {k:"power_w",        label:"Electrical in", unit:"W",   dp:0},
  {k:"optical_w",      label:"Optical out",   unit:"W",   dp:1},
  {k:"efficiency_pct", label:"Efficiency",    unit:"%",   dp:1},
  {k:"temp_c",         label:"Housing temp",  unit:"°C",  dp:1},
  {k:"flow_lpm",       label:"Coolant flow",  unit:"LPM", dp:2},
];
const HIST = 150;
const hist = {}, cv = {};
let limits = {redline_a:11.0, temp_limit_c:30.0, flow_min_lpm:2.0};
let state = "IDLE";

const $ = id => document.getElementById(id);

function buildChannels(){
  $("channels").innerHTML = CH.map(c => `
    <div class="ch" id="ch-${c.k}">
      <div class="eyebrow">${c.label}</div>
      <div class="num" id="n-${c.k}">—<small>${c.unit}</small></div>
      <canvas id="c-${c.k}"></canvas>
    </div>`).join("");
  CH.forEach(c => { hist[c.k] = []; cv[c.k] = $("c-"+c.k); });
}

function buildGauge(){
  const pct = v => (v / FULL_SCALE * 100) + "%";
  $("bandOk").style.width = pct(limits.redline_a);
  $("bandWarn").style.left = pct(limits.redline_a);
  $("bandWarn").style.width = pct(12.1 - limits.redline_a);
  $("bandBad").style.left = pct(12.1);
  $("bandBad").style.right = "0";
  $("redline").style.left = pct(limits.redline_a);
  $("cLimit").innerHTML =
    `redline ${limits.redline_a.toFixed(1)} A<br>abs max 12.1 A`;
  $("ticks").innerHTML = [0,2,4,6,8,10,12,14].map(t => `<span>${t}</span>`).join("");
}

function spark(key){
  const c = cv[key], d = hist[key];
  if(!c) return;
  const w = c.clientWidth, h = 30, dpr = devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const pts = d.filter(v => v !== null && v !== undefined);
  if(pts.length < 2) return;
  const lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
  g.beginPath();
  d.forEach((v,i) => {
    if(v === null || v === undefined) return;
    const x = i / (HIST - 1) * w;
    const y = h - 2 - ((v - lo) / span) * (h - 5);
    i === 0 ? g.moveTo(x,y) : g.lineTo(x,y);
  });
  g.strokeStyle = "#5C6670"; g.lineWidth = 1.25; g.stroke();
}

function render(s){
  const i = s.current_a;
  if(typeof i === "number"){
    $("cVal").textContent = i.toFixed(2);
    const frac = Math.max(0, Math.min(1, i / FULL_SCALE));
    $("needle").style.left = (frac * 100) + "%";
    $("fill").style.width = (frac * 100) + "%";
    $("gauge").classList.toggle("over", i > limits.redline_a);
  }

  CH.forEach(c => {
    const v = s[c.k];
    const tile = $("ch-"+c.k), num = $("n-"+c.k);
    const has = typeof v === "number";
    num.innerHTML = (has ? v.toFixed(c.dp) : "—") + `<small>${c.unit}</small>`;
    hist[c.k].push(has ? v : null);
    if(hist[c.k].length > HIST) hist[c.k].shift();
    spark(c.k);

    let stale = false, alarm = false;
    if(c.k === "optical_w") stale = s.optical_age_s === null || s.optical_age_s > 2;
    if(c.k === "temp_c") alarm = has && v > limits.temp_limit_c;
    if(c.k === "flow_lpm") alarm = has && v < limits.flow_min_lpm;
    tile.classList.toggle("stale", !!stale);
    tile.classList.toggle("alarm", !!alarm);
  });

  const guards = [
    ["Interlock", s.interlock_closed ? "CLOSED" : "OPEN", !!s.interlock_closed],
    ["Comparator", s.comparator_tripped ? "TRIPPED" : "OK", !s.comparator_tripped],
    ["Loop", ((s.loop_dt_s||0)*1000).toFixed(1)+" ms", (s.loop_dt_s||0) < 0.2],
    ["Optical age", s.optical_age_s === null || s.optical_age_s === undefined
        ? "no data" : s.optical_age_s.toFixed(2)+" s",
      s.optical_age_s !== null && s.optical_age_s < 2],
    ["Run", s.run_id || "—", !!s.run_id],
  ];
  $("guards").innerHTML = guards.map(([k,v,ok]) => `
    <div class="guard" data-ok="${ok?1:0}">
      <span class="eyebrow">${k}</span><b>${v}</b>
    </div>`).join("");
}

function setState(next, reason){
  const changed = next !== state;
  state = next;
  const chip = $("chip");
  chip.textContent = next;
  chip.dataset.state = next;
  if(changed && (next === "FAULT")) chip.classList.add("flash");
  else chip.classList.remove("flash");
  chip.title = reason || "";

  $("bArm").disabled    = next !== "IDLE";
  $("bEnable").disabled = next !== "ARMED";
  $("bStop").disabled   = !(next === "ARMED" || next === "ENABLED");
  $("bReset").disabled  = !(next === "STOPPED" || next === "FAULT");
}

function addLog(e){
  const el = document.createElement("div");
  el.className = e.name;
  const t = new Date(e.ts_ns / 1e6).toLocaleTimeString([], {hour12:false});
  el.innerHTML = `<time>${t}</time><span class="nm">${e.name}</span>
                  <span>${e.detail || ""}</span>`;
  $("log").prepend(el);
  while($("log").children.length > 80) $("log").lastChild.remove();
}

async function post(path){
  try{
    const r = await fetch(path, {method:"POST"});
    if(!r.ok) addLog({ts_ns:Date.now()*1e6, name:"rejected",
                      detail:`${path} — ${(await r.json()).detail}`});
  }catch(err){
    addLog({ts_ns:Date.now()*1e6, name:"rejected", detail:`${path} — no response`});
  }
}
$("bArm").onclick    = () => post("/arm");
$("bEnable").onclick = () => post("/enable");
$("bStop").onclick   = () => post("/stop");
$("bReset").onclick  = () => post("/reset");
$("bEstop").onclick  = () => post("/estop");
$("bMark").onclick   = () => post("/marker?label=shade");

function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/stream`);

  ws.onopen = () => {
    $("link").textContent = "LINK UP";
    $("link").dataset.up = "1";
  };
  ws.onclose = () => {
    $("link").textContent = "LINK DOWN";
    $("link").dataset.up = "0";
    setTimeout(connect, 1200);
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if(m.type === "hello"){
      limits = {redline_a:m.redline_a, temp_limit_c:m.temp_limit_c,
                flow_min_lpm:m.flow_min_lpm};
      buildGauge();
      $("ident").textContent =
        `${m.mode} · source ${m.source} · ${m.sample_hz} Hz`;
      setState(m.state, m.fault_reason);
      (m.events || []).forEach(addLog);
      if(m.latest && m.latest.ts_ns) render(m.latest);
    }else if(m.type === "sample"){
      if(m.state !== state) setState(m.state);
      render(m);
    }else if(m.type === "event"){
      addLog(m);
    }
  };
}

buildChannels();
buildGauge();
connect();
addEventListener("resize", () => CH.forEach(c => spark(c.k)));
</script>
</body>
</html>
